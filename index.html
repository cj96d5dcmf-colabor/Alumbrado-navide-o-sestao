<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alumbrado Sestao - Diagnóstico</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: 60px; }
        header { background: #7f1d1d; color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 14px; max-width: 600px; margin: 0 auto; }
        .btn-add { background: #16a34a; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; border-left: 6px solid #f59e0b; }
        .card.completado { border-left-color: #22c55e; background: #064e3b22; }
        .card-title { font-size: 1.05rem; font-weight: 700; color: #f8fafc; }
        .badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
        .badge.pendiente { background: #78350f; color: #fde68a; }
        .badge.hecho { background: #064e3b; color: #86efac; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .btn { padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-decoration: none; border: none; cursor: pointer; text-align: center; }
        .btn-map { background: #1e3a8a; color: #93c5fd; }
        .btn-gps { background: #064e3b; color: #86efac; }
        .btn-check { background: #334155; color: #f1f5f9; }
        .btn-camera { background: #831843; color: #fbcfe8; grid-column: span 2; }
        input[type="file"] { display: none; }
        #debug-box { background: #000; color: #00ff00; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-bottom: 14px; word-break: break-all; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="font-size: 1.15rem;">🎄 Alumbrado Sestao</h1>
            <p style="font-size:0.75rem;">Modo Diagnóstico Directo</p>
        </div>
        <button onclick="loadData()" class="btn-add">🔄 Probar</button>
    </header>

    <div class="container">
        <div id="debug-box">Iniciando petición a Google Apps Script...</div>
        <div id="app"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzchcHH-JHkYmZajk7hsCWEOLA_LICp2YfCXGHUcpmZDMS2G-liYzxs_VRewlEnRR7HAQ/exec";

        let items = [];

        function log(msg) {
            const box = document.getElementById('debug-box');
            box.innerHTML += "<br>> " + msg;
            console.log(msg);
        }

        async function loadData() {
            document.getElementById('debug-box').innerHTML = "Conectando a Google Apps Script...";
            try {
                let response = await fetch(WEB_APP_URL, { redirect: 'follow' });
                log("Respuesta recibida. Estado HTTP: " + response.status);
                
                let rawText = await response.text();
                log("Primeros 100 caracteres recibidos: " + rawText.substring(0, 100));

                try {
                    items = JSON.parse(rawText);
                    log("✅ JSON parseado correctamente. Elementos: " + items.length);
                    document.getElementById('debug-box').style.background = "#064e3b";
                    render(items);
                } catch(e) {
                    log("❌ ERROR PARSEANDO JSON: Google devolvió HTML en vez de datos.");
                    log("Detalle: " + e.message);
                    document.getElementById('debug-box').style.background = "#7f1d1d";
                }
            } catch (err) {
                log("❌ ERROR RED / FETCH: " + err.message);
                document.getElementById('debug-box').style.background = "#7f1d1d";
            }
        }

        function render(data) {
            const container = document.getElementById('app');
            container.innerHTML = data.map(item => {
                let isDone = item.Estado === 'Instalado' || item.Estado === 'Mapeado';
                return `
                    <div class="card ${isDone ? 'completado' : ''}">
                        <div style="display:flex; justify-content:space-between;">
                            <div>
                                <span style="font-size: 0.75rem; color: #fbbf24; font-weight: 700;">${item.ID || 'SIN_ID'}</span>
                                <div class="card-title">${item.Ubicación || 'Sin ubicación'}</div>
                            </div>
                            <span class="badge ${isDone ? 'hecho' : 'pendiente'}">${isDone ? '✓ Hecho' : 'Pendiente'}</span>
                        </div>
                        <p style="font-size:0.85rem; margin:6px 0;">Adorno: ${item.Tipo_Adorno || '-'} (${item.Cantidad || 0} ud)</p>
                        <div style="font-size:0.75rem; color:#cbd5e1;">📍 GPS: ${item.Coordenada_GPS_InSitu || 'No registrado'}</div>
                    </div>
                `;
            }).join('');
        }

        loadData();
    </script>
</body>
</html>
